{% extends 'base.html' %}

{% block title %}Página Inicial{% endblock %}

{% block content %}

    <div class="jumbotron text-center">
        <h1 class="display-4">Bem-vindo à Gestão de Eventos!</h1>
        <p class="lead">Gerencie seus eventos, horário inicial, final e local.</p>
    </div>

    <div class="container mt-4" >
        <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-body" style="background-color: aquamarine; padding: 10px">
                            <h5 class="card-title">Enventos</h5>
                            <p class="card-text">Visualize de seus eventos.</p>
                            <a href="{% url 'event_list' %}" class="btn btn-primary btn-lg">Ver Eventos</a>
                            <a class="btn btn-success btn-lg" href="{% url 'event_add' %}">Adicionar Evento</a>
                        </div>
                    </div>
                </div>
        </div>
    </div>
{% endblock %}
