{% extends 'base.html' %}

{% block title %}Inscritos no Evento{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h1>Inscritos no evento: {{ event.name }}</h1>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">Inscrever-se</button>
                    </form>
                    <a class="btn btn-info btn-lg mt-3" href="{% url 'inscrit_add' event.id %}">Voltar</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
