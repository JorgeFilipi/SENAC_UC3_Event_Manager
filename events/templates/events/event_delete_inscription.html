{% extends 'base.html' %}

{% block title %}Deletar Inscrição{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1>Cancelar Inscrição</h1>
    <p>Tem certeza de que deseja deletar a inscrição de "{{ inscricao.usuario }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Deletar</button>
        <a href="{% url 'event_detalhe' inscricao.event.id %}" class="btn btn-info">Voltar</a>
    </form>
</div>
{% endblock %}
