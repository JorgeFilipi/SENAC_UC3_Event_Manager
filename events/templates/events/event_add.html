{% extends 'base.html' %}

{% block title %}Adicionar Evento{% endblock %}

{% block content %}
<h1>Adicionar Novo Evento</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success btn-lg" href="{% url 'event_list' %}">Salvar</button>
    <button class="btn btn-info btn-lg" href="{% url 'index' %}">Voltar</button>
</form>
{% endblock %}
